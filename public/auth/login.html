<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="container" style="max-width:420px;margin-top:48px">
    <div class="card">
      <h2>Login</h2>
      <label>Email<input class="input" type="email" required autocomplete="email"></label>
      <label style="display:block;margin-top:8px">Password<input class="input" type="password" required autocomplete="current-password"></label>
      <button class="button" style="margin-top:12px">Login</button>
      <p style="margin-top:12px">No account? <a href="/auth/register">Create account</a></p>
    </div>
  </main>
  <script src="/js/main.js"></script>
</body>
</html>
